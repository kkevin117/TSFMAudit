# Data root. Override with DATA_ROOT, GIFTEVAL_ROOT, or GIFTEVAL_PRETRAIN_ROOT.
data_root: /path/to/data
gifteval_root: /path/to/data/GIFT-Eval
gifteval_pretrain_root: /path/to/data/GIFT-Eval-Pretrain

# Model name or checkpoint identifier.
model_key: moirai2
model_name: Moirai2
checkpoint: Salesforce/moirai-2.0-R-small

# Training parameters used by sft_moirai2.py.
batch_size: 4
num_epochs: 10
num_samples: 50
context_length: 128
prediction_length: 24

# Output directory for summary.csv and epoch_metrics.csv.
output_dir: outputs/moirai2_sft

environment_reference: GIFT-Eval
