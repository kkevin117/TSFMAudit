# Data root. Override with DATA_ROOT, GIFTEVAL_ROOT, or GIFTEVAL_PRETRAIN_ROOT.
data_root: /path/to/data
gifteval_root: /path/to/data/GIFT-Eval
gifteval_pretrain_root: /path/to/data/GIFT-Eval-Pretrain

# Model name or checkpoint identifier.
model_key: tirex
model_name: TiRex
checkpoint: NX-AI/TiRex

# Optional local repository path for TiRex code.
external_repo_env: TIREX_REPO

# Training parameters used by sft_tirex.py.
batch_size: 4
num_epochs: 10
num_samples: 50
context_length: 128
prediction_length: 24

# Output directory for summary.csv and epoch_metrics.csv.
output_dir: outputs/tirex_sft

# Optional neutral metadata file for leakage-name matching.
metadata_file: metadata/chronos_datasets_names.txt

environment_reference: GIFT-Eval
