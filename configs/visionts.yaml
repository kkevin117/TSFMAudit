# Data root. Override with DATA_ROOT, GIFTEVAL_ROOT, or GIFTEVAL_PRETRAIN_ROOT.
data_root: /path/to/data
gifteval_root: /path/to/data/GIFT-Eval
gifteval_pretrain_root: /path/to/data/GIFT-Eval-Pretrain

# Model/checkpoint settings.
model_key: visionts
model_name: VisionTS
architecture: mae_base
checkpoint_root: /path/to/checkpoints
visionts_ckpt_dir: /path/to/checkpoints/visionts

# Training parameters used by sft_visionts.py.
batch_size: 4
num_epochs: 10
num_samples: 50
context_length: 128
prediction_length: 24

# Output directory for summary.csv and epoch_metrics.csv.
output_dir: outputs/visionts_sft

environment_reference: VisionTS
